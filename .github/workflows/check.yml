name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    name: Clean repository check (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install runtime dependencies
        run: python3 -m pip install '.[dev]'
      - name: Run repository check
        run: python3 tools/check.py

  windows-native:
    name: Native Windows gate
    needs: repository-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install runtime dependencies
        run: python -m pip install '.[dev]'
      - name: Install plugin development dependencies
        working-directory: src/omp_deck/plugin
        run: npm ci
      - name: Run native portability contracts
        run: >-
          python -m unittest
          tests.test_attachments
          tests.test_extension_adapter
          tests.test_windows_native
      - run: omp-deck --help
      - name: Exercise Windows named-pipe plugin
        working-directory: src/omp_deck/plugin
        run: npm run check
      - name: Exercise per-user Task Scheduler lifecycle
        env:
          OMP_DECK_WINDOWS_TASK_SMOKE: "1"
        run: python -m unittest tests.test_windows_native.WindowsTaskIntegrationTests
      - name: Download pinned official OMP
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "omp.exe"
          Invoke-WebRequest "https://github.com/can1357/oh-my-pi/releases/download/v18.1.10/omp-windows-x64.exe" -OutFile $path
          $expected = "00b25bb0ad2992d252326a7ecea2527cfb85019b4a6d24a67842cf3712cd6625"
          $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "OMP checksum mismatch: $actual" }
          "OMP_DECK_WINDOWS_OMP_SMOKE_BIN=$path" >> $env:GITHUB_ENV
      - name: Exercise managed RPC against official OMP
        env:
          OPENAI_API_KEY: omp-deck-ci-not-a-real-key
        run: python -m unittest tests.test_windows_native.WindowsRpcIntegrationTests

  macos-native:
    name: Native macOS gate
    needs: repository-check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install runtime dependencies
        run: python3 -m pip install '.[dev]'
      - name: Install plugin development dependencies
        working-directory: src/omp_deck/plugin
        run: npm ci
      - name: Exercise native contracts and isolated LaunchAgent lifecycle
        env:
          OMP_DECK_MACOS_LAUNCHD_SMOKE: "1"
        run: python3 -m unittest discover -s tests
      - run: omp-deck --help
      - name: Exercise Unix-socket plugin
        working-directory: src/omp_deck/plugin
        run: npm run check

  package:
    name: Package and lifecycle gate
    needs: repository-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install build 'packaging>=24.2' 'setuptools>=77.0.3' uv==0.12.10
      - name: Seed excluded plugin dependencies
        run: mkdir -p src/omp_deck/plugin/node_modules/injected && printf 'SHOULD_NOT_SHIP = True\n' > src/omp_deck/plugin/node_modules/injected/sentinel.py
      - run: python3 -m build
      - name: Exercise immutable package identity
        env:
          OMP_DECK_PACKAGING_TESTS: "1"
        run: python3 -m unittest tests.test_packaging_identity
      - name: Verify wheel contents
        run: python3 -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert not [name for name in names if '/node_modules/' in name], names"
      - run: python3 -m pip install dist/*.whl
      - name: Verify installed artifact identity
        run: >-
          python3 -c "import subprocess; import omp_deck;
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip();
          identity = omp_deck.build_identity();
          assert identity == {'version': omp_deck.__version__, 'revision': revision}, identity;
          assert omp_deck.__version__.endswith('+g' + revision), omp_deck.__version__"
      - run: omp-deck --help
      - name: Reinstall and uninstall wheel
        run: |
          python3 -m pip install --force-reinstall --no-deps dist/*.whl
          python3 -m pip uninstall --yes omp-deck
          python3 -c "import importlib.util; assert importlib.util.find_spec('omp_deck') is None"
      - name: Exercise documented uv Git installation
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/deck-uv-cache
          UV_TOOL_DIR: ${{ runner.temp }}/deck-uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/deck-uv-bin
        run: |
          uv tool install --python 3.12 "git+file://$GITHUB_WORKSPACE"
          "$UV_TOOL_BIN_DIR/omp-deck" --help
          "$UV_TOOL_DIR/omp-deck/bin/python" -c "import os, omp_deck; identity = omp_deck.build_identity(); assert identity['revision'] == os.environ['GITHUB_SHA'], identity"
          uv tool uninstall omp-deck

  plugin:
    name: OMP plugin gate
    needs: repository-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: src/omp_deck/plugin/package-lock.json
      - working-directory: src/omp_deck/plugin
        run: npm ci
      - working-directory: src/omp_deck/plugin
        run: npm run check

  browser:
    name: Browser behavior gate
    needs: repository-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      - run: python3 -m pip install '.[dev]'
      - working-directory: src/omp_deck/plugin
        run: npm ci
      - run: npx puppeteer browsers install chrome
      - run: node --test --test-concurrency=1 tests/browser_behavior_test.mjs
      - run: python3 tools/check.py --release
