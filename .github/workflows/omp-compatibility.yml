name: Latest OMP compatibility

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-rpc:
    name: Latest OMP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Deck
        run: python3 -m pip install .
      - name: Download the latest official OMP release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$(python3 -c 'import platform, sys; print("omp-" + ("darwin" if sys.platform == "darwin" else "linux") + "-" + {"x86_64": "x64", "arm64": "arm64", "aarch64": "arm64"}[platform.machine()])')"
          release="$(gh release view --repo can1357/oh-my-pi --json tagName --jq .tagName)"
          gh release download "$release" --repo can1357/oh-my-pi --pattern "$asset" --dir "$RUNNER_TEMP/omp-native"
          chmod +x "$RUNNER_TEMP/omp-native/$asset"
          echo "OMP_SMOKE_BIN=$RUNNER_TEMP/omp-native/$asset" >> "$GITHUB_ENV"
          echo "Checking official OMP $release ($asset)"
      - name: Check startup, recovery, and independent shutdown
        run: python3 tools/check_omp.py --omp "$OMP_SMOKE_BIN"
