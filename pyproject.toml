[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "omp-deck"
version = "0.1.0"
description = "Local-first mobile control plane for OMP sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "marcelojmontanez" }]
dependencies = [
  "omp-rpc @ git+https://github.com/can1357/oh-my-pi.git@f241301c83726afe75a847e919b89977a54dafbe#subdirectory=python/omp-rpc",
  "cryptography==50.0.1",
  "websockets==15.0.1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/marcelojmontanez/omp-deck"
Repository = "https://github.com/marcelojmontanez/omp-deck"
Issues = "https://github.com/marcelojmontanez/omp-deck/issues"

[project.scripts]
omp-deck = "omp_deck.cli:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omp_deck = ["static/*", "plugin/*"]
