[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "omp-deck"
version = "1.0.0"
description = "Local-first mobile control plane for OMP sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "marcelojmontanez" }]
dependencies = [
  "omp-rpc @ git+https://github.com/can1357/oh-my-pi.git@5964a0f7649275bcde818f20073193fd032451f2#subdirectory=python/omp-rpc",
  "cryptography==50.0.1",
  "websockets==15.0.1",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["ruff>=0.13"]

[project.urls]
Homepage = "https://github.com/marcelojmontanez/omp-deck"
Repository = "https://github.com/marcelojmontanez/omp-deck"
Issues = "https://github.com/marcelojmontanez/omp-deck/issues"

[project.scripts]
omp-deck = "omp_deck.cli:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["omp_deck.plugin.node_modules*"]

[tool.setuptools.package-data]
omp_deck = ["static/*", "plugin/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "PIE",
]
ignore = [
  "E501",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["omp_deck"]

[tool.ruff.format]
quote-style = "double"
